<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Poorya Calc">
  <title>Poorya Calculator</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#151d30; --key:#202b42; --muted:#9aa8c1; --accent:#65d6a6; --text:#f4f7ff; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; min-height:100vh; min-height:100dvh; background:radial-gradient(circle at top,#1b2945,var(--bg) 55%); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif; display:flex; justify-content:center; align-items:center; padding:18px; }
    .app { width:min(100%,410px); }
    header { display:flex; justify-content:space-between; align-items:center; margin:0 3px 14px; }
    h1 { font-size:17px; margin:0; letter-spacing:.2px; }
    .sub { color:var(--muted); font-size:11px; margin-top:4px; }
    .history-btn { border:1px solid #33415e; color:var(--text); background:#172238; padding:9px 12px; border-radius:12px; font-size:12px; }
    .screen { background:rgba(15,23,42,.92); border:1px solid #263550; border-radius:23px; padding:20px 18px; min-height:142px; display:flex; flex-direction:column; justify-content:flex-end; text-align:left; direction:ltr; box-shadow:0 16px 40px #0005; overflow:hidden; }
    #expression { min-height:28px; color:var(--muted); font-size:20px; overflow-wrap:anywhere; }
    #result { font-size:clamp(34px,9vw,46px); font-weight:650; margin-top:8px; overflow-wrap:anywhere; }
    .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }
    button.key { min-height:66px; border:1px solid #2c3a56; border-radius:17px; background:var(--key); color:var(--text); font-size:23px; font-weight:500; box-shadow:0 4px 0 #10182a; }
    button.key:active { transform:translateY(2px); box-shadow:0 2px 0 #10182a; filter:brightness(1.2); }
    .utility { color:#ffb8a8!important; background:#39283a!important; }
    .operator { color:var(--accent)!important; background:#19372f!important; }
    .equals { background:var(--accent)!important; color:#082219!important; border-color:var(--accent)!important; font-weight:800!important; }
    .zero { grid-column:span 2; }
    .footer { color:var(--muted); text-align:center; font-size:11px; margin:17px 0 0; }
    dialog { width:min(92%,390px); border:1px solid #34435f; border-radius:18px; background:#151d30; color:var(--text); padding:18px; }
    dialog::backdrop { background:#0009; }
    .history-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .history-head button { background:none; border:0; color:var(--accent); font-size:13px; }
    #history-list { padding:0; margin:0; list-style:none; max-height:55vh; overflow:auto; }
    #history-list li { direction:ltr; text-align:left; padding:10px 4px; border-bottom:1px solid #2a3650; font-size:14px; overflow-wrap:anywhere; }
    .empty { color:var(--muted); text-align:center; padding:22px 0; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><h1>Poorya Calculator</h1><div class="sub">ماشین‌حساب ساده · آفلاین</div></div>
      <button class="history-btn" id="history-open">تاریخچه</button>
    </header>

    <section class="screen" aria-live="polite">
      <div id="expression">0</div>
      <div id="result">0</div>
    </section>

    <section class="keys" id="keys" aria-label="ماشین حساب">
      <button class="key utility" data-action="clear">AC</button>
      <button class="key utility" data-action="delete">DEL</button>
      <button class="key operator" data-value="%">%</button>
      <button class="key operator" data-value="/">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key operator" data-value="*">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key operator" data-value="-">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key operator" data-value="+">+</button>

      <button class="key zero" data-value="0">0</button>
      <button class="key" data-value=".">.</button>
      <button class="key equals" data-action="equals">=</button>
    </section>
    <p class="footer">محاسبات روی دستگاه انجام می‌شوند؛ برای استفاده روزمره اینترنت لازم نیست.</p>
  </main>

  <dialog id="history-dialog">
    <div class="history-head"><strong>تاریخچه محاسبات</strong><button id="history-close">بستن</button></div>
    <ul id="history-list"></ul>
  </dialog>

<script>
(() => {
  const expressionEl = document.querySelector("#expression");
  const resultEl = document.querySelector("#result");
  const keys = document.querySelector("#keys");
  const historyDialog = document.querySelector("#history-dialog");
  const historyList = document.querySelector("#history-list");
  let expression = "";
  let justEvaluated = false;

  // Parser محدود و امن؛ از eval یا اجرای کد دلخواه استفاده نمی‌کند.
  function calculate(source) {
    const tokens = source.match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+\-*/%]/g) || [];
    if (tokens.join("") !== source.replace(/\s/g, "")) throw Error("invalid");
    let pos = 0;
    const peek = () => tokens[pos];
    const take = () => tokens[pos++];

    function primary() {
      const t = take();
      if (t === "+") return primary();
      if (t === "-") return -primary();
      if (t === "(") {
        const v = sum();
        if (take() !== ")") throw Error("paren");
        return v;
      }
      if (!t || !/^(\d+\.?\d*|\.\d+)$/.test(t)) throw Error("number");
      return Number(t);
    }
    function postfix() {
      let v = primary();
      while (peek() === "%") { take(); v = v / 100; }
      return v;
    }
    function product() {
      let v = postfix();
      while (peek() === "*" || peek() === "/") {
        const op = take(), r = postfix();
        if (op === "/" && r === 0) throw Error("zero");
        v = op === "*" ? v * r : v / r;
      }
      return v;
    }
    function sum() {
      let v = product();
      while (peek() === "+" || peek() === "-") {
        const op = take(), r = product();
        v = op === "+" ? v + r : v - r;
      }
      return v;
    }
    const value = sum();
    if (pos !== tokens.length || !Number.isFinite(value)) throw Error("invalid");
    return Number(value.toPrecision(12));
  }

  function render() {
    expressionEl.textContent = expression || "0";
    if (!expression) { resultEl.textContent = "0"; return; }
    try { resultEl.textContent = String(calculate(expression)); }
    catch { resultEl.textContent = "—"; }
  }

  function addHistory(expr, result) {
    const history = JSON.parse(localStorage.getItem("poorya-calc-history") || "[]");
    history.unshift({ expr, result, at: Date.now() });
    localStorage.setItem("poorya-calc-history", JSON.stringify(history.slice(0, 30)));
  }

  function showHistory() {
    const history = JSON.parse(localStorage.getItem("poorya-calc-history") || "[]");
    historyList.innerHTML = "";
    if (!history.length) {
      const li = document.createElement("li");
      li.className = "empty"; li.textContent = "هنوز محاسبه‌ای ثبت نشده است.";
      historyList.appendChild(li);
    } else {
      history.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.expr} = ${item.result}`;
        historyList.appendChild(li);
      });
    }
    historyDialog.showModal();
  }

  function input(value) {
    if (justEvaluated && /[\d.]/.test(value)) expression = "";
    justEvaluated = false;
    if (value === ".") {
      const last = expression.split(/[+\-*/()%]/).pop();
      if (last.includes(".")) return;
      if (!last) value = "0.";
    }
    expression += value;
    render();
  }

  keys.addEventListener("click", e => {
    const button = e.target.closest("button");
    if (!button) return;
    const action = button.dataset.action;
    if (action === "clear") { expression = ""; justEvaluated = false; render(); }
    else if (action === "delete") { expression = expression.slice(0, -1); justEvaluated = false; render(); }
    else if (action === "equals") {
      try {
        const result = calculate(expression);
        addHistory(expression, result);
        expression = String(result);
        justEvaluated = true;
        render();
      } catch { resultEl.textContent = "خطا"; }
    } else if (button.dataset.value) input(button.dataset.value);
  });

  document.querySelector("#history-open").addEventListener("click", showHistory);
  document.querySelector("#history-close").addEventListener("click", () => historyDialog.close());

  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(console.error));
  }
  render();
})();
</script>
</body>
</html>
